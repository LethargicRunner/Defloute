          if ! git apply --check /tmp/maj.patch; then
            echo "::error::Le code du dépôt a changé depuis la V0.7.1 : mise à jour NON appliquée, rien n'a été modifié."
            exit 1
          fi
          git apply /tmp/maj.patch
          git status --short

      - name: Enregistrer dans le dépôt
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V0.9.1 : galerie directe, zones brûlées, heure de fin, réglages (rotation, arrière-plan), service de traitement, version affichée, nettoyage"
          git push

      - name: Set up JDK 17
        if: steps.check.outputs.done != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        if: steps.check.outputs.done != 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate wrapper
        if: steps.check.outputs.done != 'true'
        run: gradle wrapper --gradle-version 8.7

      - name: Unit tests
        if: steps.check.outputs.done != 'true'
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        if: steps.check.outputs.done != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        if: steps.check.outputs.done != 'true'
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/debug/app-debug.apk "Defloute-v${VERSION}.apk"

      - name: Upload APK
        if: steps.check.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Defloute-APK
          path: Defloute-v*.apk
