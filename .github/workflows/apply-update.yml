name: Appliquer la mise à jour 0.4.0 (IA, bruit, lumière, mode d'emploi)

# À lancer UNE fois à la main : onglet Actions > ce workflow > Run workflow.
# Il applique les fichiers de la mise à jour, génère le modèle IA, enregistre le tout
# dans le dépôt, puis compile l'APK (à récupérer dans « Artifacts » de ce run).

