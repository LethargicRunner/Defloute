name: Build APK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/debug/app-debug.apk "Defloute-v${VERSION}.apk"
          echo "apk=Defloute-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Defloute-APK
          path: Defloute-v*.apk

      # Diagnostic : en cas d'échec, publie le détail des tests qui plantent
      # dans une issue GitHub (lisible sans droits admin).
      - name: Report test failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Échec CI sur ${GITHUB_SHA::8}"
            echo
            if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
              for f in app/build/test-results/testDebugUnitTest/*.xml; do
                grep -o '<testcase name="[^"]*"[^/>]*' "$f" | head -50
                grep -B1 -A8 '<failure' "$f" | head -80
              done
            else
              echo "Pas de résultats de tests : échec probable de COMPILATION."
              find app/build -name '*.log' 2>/dev/null | head
            fi
          } > /tmp/report.md
          gh issue create -R "${GITHUB_REPOSITORY}" -t "CI échec ${GITHUB_SHA::8}" -F /tmp/report.md || true
