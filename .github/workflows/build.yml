name: Build APK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/debug/app-debug.apk "Defloute-v${VERSION}.apk"
          echo "apk=Defloute-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Defloute-APK
          path: Defloute-v*.apk

      # Diagnostic : en cas d'echec, publie le log (erreurs extraites) sur la branche ci-logs
      - name: Publish failure logs
        if: failure()
        env:
          TOKEN: ${{ github.token }}
        run: |
          ./gradlew compileDebugKotlin testDebugUnitTest --no-daemon --stacktrace > /tmp/build.log 2>&1 || true
          grep -E "^e: |error: |FAILURE|What went wrong" /tmp/build.log | head -80 > /tmp/errors.txt || true
          tail -60 /tmp/build.log >> /tmp/errors.txt || true
          mkdir /tmp/pub && cp /tmp/build.log /tmp/errors.txt /tmp/pub/
          cd /tmp/pub
          git init -q -b ci-logs
          git config user.email "ci@local" && git config user.name "ci"
          git add -A
          git commit -qm "logs ${GITHUB_SHA::8}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
