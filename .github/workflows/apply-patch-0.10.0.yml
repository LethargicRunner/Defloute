      - name: Enregistrer dans le dépôt
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V0.10.0 : mode Auto (diagnostic automatique : flou de bougé et de mise au point, bruit, JPEG, exposition), banc d essai PSNR/SSIM"
          git push

      - name: Set up JDK 17
        if: steps.check.outputs.done != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        if: steps.check.outputs.done != 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Generate wrapper
        if: steps.check.outputs.done != 'true'
        run: gradle wrapper --gradle-version 8.7

      - name: Unit tests
        if: steps.check.outputs.done != 'true'
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        if: steps.check.outputs.done != 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        if: steps.check.outputs.done != 'true'
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/debug/app-debug.apk "Defloute-v${VERSION}.apk"

      - name: Upload APK
        if: steps.check.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Defloute-APK
          path: Defloute-v*.apk
