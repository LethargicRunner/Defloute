name: Appliquer la mise à jour 0.12.0 (partage, métadonnées, journal, accélération IA)

# Se lance TOUT SEUL dès que ce fichier est envoyé sur GitHub (ou à la main : Actions > Run workflow).
# La mise à jour ne s'applique que si le code est dans l'état attendu (V0.10.0) ;
# sinon le workflow s'arrête sans rien modifier. Si elle est déjà appliquée, il ne fait rien.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-patch-0.12.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déjà appliquée ?
        id: check
        run: |
          if grep -q 'versionName = "0.12.0"' app/build.gradle.kts; then
            echo "La mise à jour 0.12.0 est déjà dans le dépôt : rien à faire."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier puis appliquer la mise à jour
        if: steps.check.outputs.done != 'true'
