      - name: Générer le modèle IA (Real-ESRGAN general-x4v3 -> ONNX)
        run: |
          pip install numpy onnx
          python tools/make_esrgan_onnx.py app/src/main/assets/realesr-general-x4v3.onnx

      - name: Enregistrer la mise à jour dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mise à jour 0.4.0 : IA Real-ESRGAN, réduction du bruit, correction lumière, mode d'emploi"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle wrapper
        uses: gradle/actions/setup-gradle@v3

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.7 || true

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/debug/app-debug.apk "Defloute-v${VERSION}.apk"
          echo "apk=Defloute-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Defloute-APK
          path: Defloute-v*.apk
